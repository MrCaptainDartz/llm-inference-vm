---
- name: Build the offline bundle on an internet-connected Ubuntu 26.04 host
  hosts: bundle_builder
  become: true
  tasks:
    - name: Run the airgap bundle fetcher
      ansible.builtin.command:
        cmd: "{{ playbook_dir }}/../scripts/fetch-airgap-bundle.sh --output {{ playbook_dir }}/../airgap-bundle"
        chdir: "{{ playbook_dir }}/.."
      changed_when: true
