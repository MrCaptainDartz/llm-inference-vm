---
- name: Provision and configure LLM inference VM environment
  hosts: all
  become: true
  pre_tasks:
    - name: Default the inference account name when the deployment did not set it
      ansible.builtin.set_fact:
        inference_user: "{{ inference_user | default('inference') }}"

    - name: Wait for cloud-init to finish its initial setup
      ansible.builtin.wait_for:
        path: /var/lib/cloud/instance/boot-finished
        state: present
        timeout: 600

  roles:
    - role: airgap
      when: airgap_mode | default(false)
    - system_timezone
    - essential_packages
    - developer_config
    - security_hardening
    - inference_user
    - podman
    - firewall
    - role: nvidia
      when: nvidia_enabled | default(false)
    - role: sglang
      when: sglang_enabled | default(false)
    - role: docling
      when: docling_enabled | default(true)
    - role: open_webui
      when: open_webui_enabled | default(true)

  post_tasks:
    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    # A VM that does not survive its own reboots can turn this off: the play ends on the running kernel.
    - name: Reboot machine to apply pending kernel updates
      ansible.builtin.reboot:
        msg: "Rebooting machine to apply pending kernel updates"
      when:
        - reboot_required_file.stat.exists
        - system_reboot_on_kernel_update | default(true)

    - name: VM Ready for LLM inference
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }} is ready!"
          - "Admin access: ssh {{ ansible_user }}@{{ ansible_host }}"
          - >-
            Inference services account (non-admin, rootless Podman):
            ssh {{ inference_user }}@{{ ansible_host }}
