---
- name: Configure the inference LXC (vLLM + LiteLLM + Docling)
  hosts: inference_lxc
  become: true
  roles:
    - role: airgap
      when: airgap_mode | default(false)
    - lxc_base
    - lxc_security
    - developer_config
    - inference_user
    - lxc_docker
    - inference_stack

  post_tasks:
    - name: Inference LXC ready
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }} is ready"
          - "LiteLLM: http://{{ ansible_host }}:{{ litellm_port }}/v1"
          - "Docling: http://{{ ansible_host }}:{{ docling_port }}"
          - "vLLM started: {{ vllm_start | bool }}"
          - "Docling GPU: {{ docling_gpu | bool }}"
          - "OCR/table (Open WebUI .env): {{ docling_ocr_preset | default('tesseract') }}/{{ docling_ocr_lang | default(['fr']) | join(',') }}, TableFormer accurate"
