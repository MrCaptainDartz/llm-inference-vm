---
# Runs only when airgap_mode is true; bundle location on the VM (llm_bundle_dir).
airgap_bundle_dir: "{{ llm_bundle_dir | default('/airgap-bundle') }}"
# Verify the whole bundle before touching apt. Disable only for a deliberately
# partial/development bundle that has no SHA256SUMS.
airgap_verify_checksums: true
