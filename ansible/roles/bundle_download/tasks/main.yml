---
# Builds a self-contained bundle: repo/ (apt), images/ (tars), models/ (HF),
# docling-artifacts/ (OCR weights), cloudimg/ (Ubuntu Cloud-Init image).

- name: Assert the builder is Ubuntu 26.04 on amd64
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == '26.04'
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: >-
      The bundle must be built on Ubuntu 26.04 amd64 (same release as the
      target VM), so apt resolves identical package versions.

- name: Create the bundle directory layout
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ bundle_download_pool_dir }}"
    - "{{ bundle_download_images_dir }}"
    - "{{ bundle_download_models_dir }}"
    - "{{ bundle_download_docling_artifacts_dir }}"
    - "{{ bundle_download_cloud_image_dir }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Create the apt keyrings directory
  ansible.builtin.file:
    path: "{{ bundle_download_nvidia_keyring | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Add the NVIDIA Container Toolkit signing key
  ansible.builtin.get_url:
    url: "{{ bundle_download_nvidia_key_url }}"
    dest: "{{ bundle_download_nvidia_keyring }}"
    owner: root
    group: root
    mode: '0644'

- name: Add the NVIDIA Container Toolkit apt repository
  ansible.builtin.apt_repository:
    repo: "{{ bundle_download_nvidia_repo }}"
    filename: nvidia-container-toolkit
    state: present

- name: Update apt cache after adding the NVIDIA repository
  ansible.builtin.apt:
    update_cache: true

# Empty driver list = ship every open-flavour headless series for the target to pick from.
- name: Resolve the NVIDIA driver packages to ship
  ansible.builtin.command:
    cmd: apt-cache search --names-only '^nvidia-headless-[0-9]+-server-open$'
  register: bundle_download_nvidia_search
  changed_when: false

- name: Set the base package download list
  ansible.builtin.set_fact:
    bundle_download_list: "{{ bundle_download_apt_packages
      + (bundle_download_nvidia_driver_packages | default([])) }}"

# --download-only fetches the full closure; runs before builder tools install (see assert above).
- name: Download the apt dependency closure into the bundle pool # noqa: command-instead-of-module
  # The apt module cannot express --download-only with a custom archives dir.
  ansible.builtin.command:
    cmd: "apt-get install --download-only -y -o Dir::Cache::archives={{ bundle_download_pool_dir }} {{ bundle_download_list | join(' ') }}"
  register: bundle_download_apt_download
  changed_when: false

# Driver series conflict with each other: resolve each one in its own transaction.
- name: Download each NVIDIA driver series into the bundle pool # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: "apt-get install --download-only -y -o Dir::Cache::archives={{ bundle_download_pool_dir }} {{ item }}"
  loop: "{{ bundle_download_nvidia_search.stdout_lines | map('split') | map('first') | list }}"
  changed_when: false

- name: Install the builder tools
  ansible.builtin.apt:
    name:
      - skopeo
      - podman
      - dpkg-dev
    state: present

# docker-archive keeps the full reference, so podman load restores the exact Quadlet tag.
- name: Copy the container images into the bundle
  ansible.builtin.command:
    cmd: >-
      skopeo copy --retry 3 docker://{{ item.value }}
      docker-archive:{{ bundle_download_images_dir }}/{{ item.key }}.tar:{{ item.value }}
  loop: "{{ bundle_download_images | dict2items }}"
  changed_when: false

- name: Read the model file lists from Hugging Face
  ansible.builtin.uri:
    url: "https://huggingface.co/api/models/{{ item.repo }}"
    return_content: true
  loop: "{{ bundle_download_models }}"
  loop_control:
    label: "{{ item.repo }}"
  register: bundle_download_hf_api

- name: Create the model snapshot directories
  ansible.builtin.file:
    path: "{{ bundle_download_models_dir }}/{{ item.0.item.dir }}/{{ item.1.rfilename | dirname }}"
    state: directory
    mode: '0755'
  loop: "{{ bundle_download_hf_api.results | subelements('json.siblings') }}"
  loop_control:
    label: "{{ item.0.item.dir }}/{{ item.1.rfilename }}"

- name: Download the model snapshots
  # get_url follows the CDN redirects used by LFS files (safetensors).
  ansible.builtin.get_url:
    url: "https://huggingface.co/{{ item.0.item.repo }}/resolve/{{ item.0.json.sha }}/{{ item.1.rfilename }}"
    dest: "{{ bundle_download_models_dir }}/{{ item.0.item.dir }}/{{ item.1.rfilename }}"
    mode: '0644'
  loop: "{{ bundle_download_hf_api.results | subelements('json.siblings') }}"
  loop_control:
    label: "{{ item.0.item.dir }}/{{ item.1.rfilename }}"

# Bake Docling artifacts: run the VM image, convert one PDF, keep /app/data weights.
- name: Load the Docling image on the builder
  ansible.builtin.command:
    cmd: "podman load -i {{ bundle_download_images_dir }}/docling.tar"
  changed_when: false

- name: Run Docling to bake its model artifacts
  ansible.builtin.command:
    cmd: >-
      podman run -d --name docling-bake
      -p 127.0.0.1:5001:5001
      -e DOCLING_SERVE_ARTIFACTS_PATH=/app/data
      -v {{ bundle_download_docling_artifacts_dir }}:/app/data
      {{ bundle_download_images.docling }}
  changed_when: false

- name: Wait for Docling to come up
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 5001
    timeout: 300

- name: Convert a test PDF to force the model downloads # noqa: command-instead-of-module
  # The uri module cannot post multipart file uploads.
  ansible.builtin.command:
    cmd: >-
      curl -s -o /dev/null -w %{http_code}
      -F files=@{{ role_path }}/files/test.pdf
      http://127.0.0.1:5001/v1/convert/file
  register: bundle_download_docling_convert
  changed_when: false
  failed_when: bundle_download_docling_convert.stdout != '200'
  retries: 3
  delay: 10
  until: bundle_download_docling_convert.stdout == '200'

- name: Remove the Docling bake container
  ansible.builtin.command:
    cmd: podman rm -f docling-bake
  changed_when: false

- name: Download the Ubuntu Cloud-Init image
  ansible.builtin.get_url:
    url: "{{ bundle_download_cloud_image_url }}"
    dest: "{{ bundle_download_cloud_image_dir }}/{{ bundle_download_cloud_image_filename }}"
    mode: '0644'

# The airgapped VM points apt at deb [trusted=yes] file://<bundle>/repo ./
- name: Build the apt repository index
  ansible.builtin.shell: |
    set -o pipefail
    cd "{{ bundle_download_repo_dir }}"
    dpkg-scanpackages pool /dev/null | gzip -9 > Packages.gz
  changed_when: true

- name: Show the bundle size
  ansible.builtin.command:
    cmd: "du -sh {{ bundle_download_dir }}"
  register: bundle_download_size
  changed_when: false

- name: Bundle summary
  ansible.builtin.debug:
    msg:
      - "Bundle ready at {{ bundle_download_dir }} ({{ bundle_download_size.stdout }})"
      - "Transfer it to the VM at {{ llm_bundle_dir | default('/airgap-bundle') }} (e.g. rsync), then run playbook.yml with airgap_mode: true."
