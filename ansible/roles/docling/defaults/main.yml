---
docling_user: "{{ inference_user | default('inference') }}"

# CPU or CUDA image; cu130 aligns with the sglang CUDA 13 stack (one driver).
docling_gpu: false
docling_image: "{{ 'quay.io/docling-project/docling-serve-cu130:latest' if docling_gpu else 'quay.io/docling-project/docling-serve:latest' }}"

# Docling UI exposed for debugging, localhost only (RAG traffic stays on the internal Podman network).
docling_port: 5001

# docling-serve settings (see https://docs.openwebui.com — Docling Document Extraction).
# DOCLING_SERVE_ARTIFACTS_PATH matches the /app/data volume (airgap: baked weights, online: downloads).
# UVICORN_WORKERS must stay at 1: more workers break the in-memory task store.
docling_env:
  DOCLING_SERVE_ARTIFACTS_PATH: "/app/data"
  DOCLING_SERVE_ENABLE_UI: "true"
  DOCLING_SERVE_MAX_SYNC_WAIT: "600"
  DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
  UVICORN_WORKERS: "1"

# Airgap: load the image from the bundle and reuse the pre-baked model artifacts.
docling_offline: "{{ airgap_mode | default(false) }}"

# Bundle location on the VM (airgap only).
docling_bundle_dir: "{{ llm_bundle_dir | default('/airgap-bundle') }}"
