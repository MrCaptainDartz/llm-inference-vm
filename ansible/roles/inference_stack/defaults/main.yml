---
# vLLM, LiteLLM, and Docling; only LiteLLM and Docling are LAN-facing.

inference_stack_root: "/srv/llm"
inference_stack_compose_dir: "/srv/llm/compose"
inference_stack_litellm_dir: "/srv/llm/litellm"
inference_stack_hf_cache_dir: "/srv/llm/hf-cache"
# Reload bundle images even when Docker already has them.
inference_stack_force_load_images: false

vllm_image: "vllm/vllm-openai:v0.34.0"
vllm_served_model_name: "qwen3.8-27b"
vllm_model_path: "{{ '/models/qwen3.8-27b-nvfp4' if (airgap_mode | default(false)) else 'unsloth/Qwen3.8-27B-NVFP4' }}"
vllm_draft_model_path: "{{ '/models/qwen3.8-27b-dflash2-draft' if (airgap_mode | default(false)) else 'maurienne-ai/Qwen3.8-27B-DFlash2-NVFP4-RTNcal' }}"
vllm_speculative_method: "dflash"
vllm_speculative_num_tokens: 7
# Leave VRAM for Docling when it runs on the GPU.
vllm_gpu_memory_utilization: "{{ '0.78' if (docling_gpu | default(false)) else '0.82' }}"
vllm_max_model_len: 262144
vllm_kv_cache_dtype: "nvfp4"
vllm_attention_backend: "flash_attn"
vllm_max_num_seqs: 4
vllm_max_num_batched_tokens: 32768
# Keep false unless the model ships custom modeling code.
vllm_trust_remote_code: false
vllm_enforce_eager: false
vllm_reasoning_parser: "qwen3"
vllm_tool_call_parser: "qwen3_coder"
vllm_enable_auto_tool_choice: true
vllm_hf_token: ""

# false starts LiteLLM + Docling only, without loading vLLM.
vllm_start: true

vllm_offline: "{{ airgap_mode | default(false) }}"
vllm_bundle_dir: "{{ llm_bundle_dir | default('/airgap-bundle') }}"

vllm_embedding_enabled: true
vllm_embedding_model_path: "{{ '/models/qwen3-embedding-0.6b' if (airgap_mode | default(false)) else 'Qwen/Qwen3-Embedding-0.6B' }}"
vllm_embedding_served_model_name: "qwen3-embedding-0.6b"
vllm_embedding_gpu_memory_utilization: 0.06
vllm_embedding_max_model_len: 32768
vllm_embedding_port: 8001

# Docling uses CUDA on the 48 GB target, CPU otherwise.
docling_gpu: false
docling_image: "{{ 'quay.io/docling-project/docling-serve-cu130:v1.38.2' if (docling_gpu | default(false)) else 'quay.io/docling-project/docling-serve:v1.38.2' }}"
docling_port: 5001
docling_api_key: "change-me"
docling_enable_ui: false
docling_tessdata_dir: "/srv/llm/docling/tessdata"
docling_tessdata_url: "https://github.com/tesseract-ocr/tessdata_fast/raw/main/fra.traineddata"
docling_offline: "{{ airgap_mode | default(false) }}"
docling_bundle_dir: "{{ llm_bundle_dir | default('/airgap-bundle') }}"

litellm_image: "ghcr.io/berriai/litellm:main-stable"
litellm_port: 4000
litellm_master_key: "change-me"
