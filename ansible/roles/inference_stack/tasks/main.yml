---
- name: Assert that a LiteLLM master key is configured
  ansible.builtin.assert:
    that:
      - litellm_master_key is defined
      - litellm_master_key | length >= 16
      - litellm_master_key is not search('change-me|CHANGE-ME')
    fail_msg: >-
      litellm_master_key must be set to a strong value in group_vars/all.yml
      (openssl rand -hex 32).

- name: Assert that a Docling API key is configured
  ansible.builtin.assert:
    that:
      - docling_api_key is defined
      - docling_api_key | length >= 16
      - docling_api_key is not search('change-me|CHANGE-ME')
    fail_msg: >-
      docling_api_key must be set to a strong value in group_vars/all.yml
      (openssl rand -hex 32); the Open WebUI compose uses the same value.

- name: Create the inference stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ inference_stack_root }}"
    - "{{ inference_stack_compose_dir }}"
    - "{{ inference_stack_litellm_dir }}"
    - "{{ inference_stack_hf_cache_dir }}"
    - "{{ docling_tessdata_dir }}"

# Docling expects fr.traineddata; Tesseract ships the model as fra.traineddata.
- name: Download the French Tesseract data (online)
  ansible.builtin.get_url:
    url: "{{ docling_tessdata_url }}"
    dest: "{{ docling_tessdata_dir }}/fra.traineddata"
    owner: root
    group: root
    mode: '0644'
  when: not (docling_offline | bool)

- name: Copy the bundled French Tesseract data (airgap)
  ansible.builtin.copy:
    src: "{{ docling_bundle_dir }}/tessdata/fra.traineddata"
    dest: "{{ docling_tessdata_dir }}/fra.traineddata"
    remote_src: true
    owner: root
    group: root
    mode: '0644'
  when: docling_offline | bool

- name: Provide the ISO-named Tesseract data expected by Docling
  ansible.builtin.copy:
    src: "{{ docling_tessdata_dir }}/fra.traineddata"
    dest: "{{ docling_tessdata_dir }}/fr.traineddata"
    remote_src: true
    owner: root
    group: root
    mode: '0644'

- name: Read the airgap bundle manifest
  ansible.builtin.slurp:
    src: "{{ vllm_bundle_dir }}/manifest.json"
  register: inference_stack_manifest_raw
  when: vllm_offline | bool

- name: Parse the airgap bundle manifest
  ansible.builtin.set_fact:
    inference_stack_bundle_manifest: "{{ inference_stack_manifest_raw.content | b64decode | from_json }}"
  when: vllm_offline | bool

- name: Use the image references recorded in the bundle manifest
  ansible.builtin.set_fact:
    vllm_image: "{{ inference_stack_bundle_manifest.images.vllm.reference }}"
    litellm_image: "{{ inference_stack_bundle_manifest.images.litellm.reference }}"
    docling_image: >-
      {{ inference_stack_bundle_manifest.images.docling.reference
         if (docling_gpu | bool)
         else inference_stack_bundle_manifest.images.docling_cpu.reference }}
  when: vllm_offline | bool

- name: Deploy the Docker Compose stack
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ inference_stack_compose_dir }}/compose.yaml"
    owner: root
    group: root
    mode: '0600'
  register: inference_stack_compose_file
  no_log: true

- name: Deploy the LiteLLM model routing configuration
  ansible.builtin.template:
    src: litellm-config.yaml.j2
    dest: "{{ inference_stack_litellm_dir }}/config.yaml"
    owner: root
    group: root
    mode: '0644'

- name: Deploy the LiteLLM master key environment file
  ansible.builtin.template:
    src: litellm.env.j2
    dest: "{{ inference_stack_litellm_dir }}/litellm.env"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: List the images already present in Docker
  ansible.builtin.command:
    cmd: "docker image inspect {{ item }}"
  loop: "{{ [litellm_image, docling_image] + ([vllm_image] if (vllm_start | bool) else []) }}"
  register: inference_stack_image_check
  changed_when: false
  failed_when: false

- name: Remember which images must still be loaded
  ansible.builtin.set_fact:
    inference_stack_missing_images: >-
      {{ (inference_stack_image_check.results | map(attribute='item') | list)
         if (inference_stack_force_load_images | bool)
         else (inference_stack_image_check.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list) }}

- name: Load the LiteLLM image from the bundle (airgap)
  ansible.builtin.command:
    cmd: "docker load -i {{ vllm_bundle_dir }}/images/litellm.tar"
  register: inference_stack_litellm_load
  changed_when: "'Loaded image' in inference_stack_litellm_load.stdout"
  when:
    - vllm_offline | bool
    - litellm_image in inference_stack_missing_images

- name: Load the vLLM image from the bundle (airgap)
  ansible.builtin.command:
    cmd: "docker load -i {{ vllm_bundle_dir }}/images/vllm.tar"
  register: inference_stack_vllm_load
  changed_when: "'Loaded image' in inference_stack_vllm_load.stdout"
  when:
    - vllm_offline | bool
    - vllm_start | bool
    - vllm_image in inference_stack_missing_images

- name: Load the Docling image from the bundle (airgap)
  ansible.builtin.command:
    cmd: "docker load -i {{ vllm_bundle_dir }}/images/{{ 'docling.tar' if (docling_gpu | bool) else 'docling-cpu.tar' }}"
  register: inference_stack_docling_load
  changed_when: "'Loaded image' in inference_stack_docling_load.stdout"
  when:
    - docling_offline | bool
    - docling_image in inference_stack_missing_images

- name: Validate the Docker Compose configuration
  ansible.builtin.command:
    cmd: "docker compose -f {{ inference_stack_compose_dir }}/compose.yaml config --quiet"
  changed_when: false

- name: Stop vLLM chat when vLLM is disabled
  ansible.builtin.command:
    cmd: "docker compose -f {{ inference_stack_compose_dir }}/compose.yaml stop vllm"
  register: inference_stack_stop_vllm
  changed_when: "'Stopped' in inference_stack_stop_vllm.stdout"
  failed_when: false
  when: not (vllm_start | bool)

- name: Stop vLLM embedding when the service is deployed but vLLM is disabled
  ansible.builtin.command:
    cmd: "docker compose -f {{ inference_stack_compose_dir }}/compose.yaml stop vllm-embedding"
  register: inference_stack_stop_vllm_embedding
  changed_when: "'Stopped' in inference_stack_stop_vllm_embedding.stdout"
  failed_when: false
  when:
    - vllm_embedding_enabled | bool
    - not (vllm_start | bool)

- name: Compute the compose up command
  ansible.builtin.set_fact:
    inference_stack_up_command: >-
      docker compose -f {{ inference_stack_compose_dir }}/compose.yaml up -d --remove-orphans
      {{ '--pull never' if (vllm_offline | bool) else '' }}
      {{ 'litellm docling' if not (vllm_start | bool) else '' }}

- name: Start the inference stack
  ansible.builtin.command:
    cmd: "{{ inference_stack_up_command }}"
  register: inference_stack_up
  changed_when: >-
    (inference_stack_compose_file.changed | default(false)) or
    ('Started' in inference_stack_up.stdout) or
    ('Recreated' in inference_stack_up.stdout) or
    ('Created' in inference_stack_up.stdout)

- name: Wait for vLLM to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:8000/v1/models"
    status_code: 200
    timeout: 5
  register: inference_stack_vllm_health
  until: inference_stack_vllm_health.status | default(0) == 200
  retries: 120
  delay: 5
  changed_when: false
  when: vllm_start | bool

- name: Wait for the embedding service to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ vllm_embedding_port }}/v1/models"
    status_code: 200
    timeout: 5
  register: inference_stack_embedding_health
  until: inference_stack_embedding_health.status | default(0) == 200
  retries: 60
  delay: 5
  changed_when: false
  when:
    - vllm_start | bool
    - vllm_embedding_enabled | bool

- name: Wait for the LiteLLM port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ litellm_port }}"
    delay: 2
    timeout: 90

- name: Wait for the LiteLLM proxy to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ litellm_port }}/health/liveliness"
    status_code: 200
    timeout: 3
  register: inference_stack_litellm_health
  until: inference_stack_litellm_health.status | default(0) == 200
  retries: 30
  delay: 2
  changed_when: false

- name: Wait for the Docling port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ docling_port }}"
    delay: 2
    timeout: 120

- name: Wait for Docling to answer (API key protected)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ docling_port }}/health"
    status_code: 200
    timeout: 5
    headers:
      X-Api-Key: "{{ docling_api_key }}"
  register: inference_stack_docling_health
  until: inference_stack_docling_health.status | default(0) == 200
  retries: 30
  delay: 2
  changed_when: false
  no_log: true

- name: Show the inference endpoints
  ansible.builtin.debug:
    msg:
      - "LiteLLM (LAN): http://{{ ansible_host }}:{{ litellm_port }}/v1"
      - "Docling (LAN): http://{{ ansible_host }}:{{ docling_port }}"
      - "vLLM debug (LXC localhost only): http://127.0.0.1:8000/v1"
      - "vLLM started: {{ vllm_start | bool }}"
      - "Docling GPU: {{ docling_gpu | bool }}"
      - "OCR/table (Open WebUI .env): {{ docling_ocr_preset | default('tesseract') }}/{{ docling_ocr_lang | default(['fr']) | join(',') }}, TableFormer accurate"
