---
- name: Set the LXC timezone
  community.general.timezone:
    name: "{{ system_timezone_value | default('Europe/Paris') }}"

- name: Keep the Proxmox host as the NTP source for the LXC
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: stopped
    enabled: false
  failed_when: false

- name: Install the LXC base packages
  ansible.builtin.apt:
    name: "{{ lxc_base_packages }}"
    state: present
    update_cache: true

- name: Configure key-only SSH for the appliance
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-llm-lxc.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Ansible managed: inference LXC
      PermitRootLogin {{ lxc_base_ssh_permit_root_login }}
      PasswordAuthentication {{ lxc_base_ssh_password_authentication }}
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      AllowTcpForwarding {{ lxc_base_ssh_allow_tcp_forwarding }}
  notify: Restart SSH

- name: Ensure SSH is enabled and running
  ansible.builtin.systemd_service:
    name: ssh
    state: started
    enabled: true

- name: Create the service data root
  ansible.builtin.file:
    path: /srv/llm
    state: directory
    owner: root
    group: root
    mode: '0755'
