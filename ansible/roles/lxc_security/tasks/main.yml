---
- name: Install fail2ban
  ansible.builtin.apt:
    name:
      - fail2ban
    state: present
    update_cache: true
  when: lxc_security_fail2ban_enabled | bool

- name: Remove the obsolete fail2ban jail fragment
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d/99-llm.local
    state: absent
  when: lxc_security_fail2ban_enabled | bool

- name: Configure fail2ban (temporary bans)
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
  when: lxc_security_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Validate the fail2ban configuration
  ansible.builtin.command:
    cmd: fail2ban-client -t
  changed_when: false
  when: lxc_security_fail2ban_enabled | bool

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true
  when: lxc_security_fail2ban_enabled | bool
