---
# Driver package; empty = auto-detect via `ubuntu-drivers list --gpgpu` (-open flavor only).
# Blackwell requires the open kernel modules; pin to override (e.g. "nvidia-headless-580-server-open").
nvidia_driver_package: ""

nvidia_container_toolkit_key_url: "https://nvidia.github.io/libnvidia-container/gpgkey"
nvidia_container_toolkit_keyring: "/etc/apt/keyrings/nvidia-container-toolkit.asc"
nvidia_container_toolkit_repo: "deb [signed-by={{ nvidia_container_toolkit_keyring }}] https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /"

# CDI specification consumed by rootless Podman (AddDevice=nvidia.com/gpu=all).
nvidia_cdi_spec: "/etc/cdi/nvidia.yaml"

# Minimum driver version for the CUDA 13 images (sglang/docling -cu130).
nvidia_min_driver_version: "580"

# Airgap: driver and toolkit ship in the bundle repository; skip network apt setup.
nvidia_offline: "{{ airgap_mode | default(false) }}"
