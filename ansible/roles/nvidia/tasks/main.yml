---
# Headless NVIDIA driver, Container Toolkit and CDI spec for rootless Podman GPU access.

- name: Assert an NVIDIA GPU is present on this host
  ansible.builtin.command:
    cmd: lspci -nn
  register: nvidia_lspci
  changed_when: false
  failed_when: not (nvidia_lspci.stdout | lower is search('nvidia'))

- name: Install driver detection tooling
  ansible.builtin.apt:
    name:
      - ubuntu-drivers-common
      - pciutils
    state: present
    update_cache: true

- name: Detect the recommended headless driver package
  ansible.builtin.command:
    cmd: ubuntu-drivers list --gpgpu
  register: nvidia_drivers_list
  changed_when: false
  when: nvidia_driver_package | default('') | length == 0

# ubuntu-drivers prints "pkg, license" lines, newest last; Blackwell needs the -open flavor.
- name: Resolve the driver package to install
  ansible.builtin.set_fact:
    nvidia_driver_resolved: "{{ nvidia_driver_package | default('') | length > 0
      | ternary(nvidia_driver_package,
        nvidia_drivers_list.stdout_lines | select('match', '^[^,]*-open')
        | list | last | split(',') | first) }}"

- name: Assert an open-kernel-module driver package was found
  ansible.builtin.assert:
    that:
      - nvidia_driver_resolved is match('^[^,]*-open$')
    fail_msg: >-
      No -open (open kernel modules) driver package found in ubuntu-drivers
      output. Blackwell GPUs require it. Pin one explicitly with
      nvidia_driver_package (e.g. "nvidia-headless-580-server-open").
    success_msg: "Driver package: {{ nvidia_driver_resolved }}"
  when: nvidia_driver_package | default('') | length == 0

- name: Check if a reboot is pending from kernel updates
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: nvidia_reboot_required_file

- name: Reboot to boot into the updated kernel before compiling NVIDIA modules
  ansible.builtin.reboot:
    msg: "Rebooting to activate updated kernel before NVIDIA driver setup"
  when:
    - nvidia_reboot_required_file.stat.exists
    - system_reboot_on_kernel_update | default(true)

- name: Install the NVIDIA headless driver
  ansible.builtin.apt:
    name: "{{ nvidia_driver_resolved }}"
    state: present

# The NVIDIA Container Toolkit apt repository lives in the bundle when airgapped.
- name: Create the apt keyrings directory
  ansible.builtin.file:
    path: "{{ nvidia_container_toolkit_keyring | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Add the NVIDIA Container Toolkit signing key
  ansible.builtin.get_url:
    url: "{{ nvidia_container_toolkit_key_url }}"
    dest: "{{ nvidia_container_toolkit_keyring }}"
    owner: root
    group: root
    mode: '0644'
  when: not (nvidia_offline | default(false))

- name: Add the NVIDIA Container Toolkit apt repository
  ansible.builtin.apt_repository:
    repo: "{{ nvidia_container_toolkit_repo }}"
    filename: nvidia-container-toolkit
    state: present
  when: not (nvidia_offline | default(false))

- name: Install the NVIDIA Container Toolkit
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true

- name: Create the CDI specification directory
  ansible.builtin.file:
    path: "{{ nvidia_cdi_spec | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Load the NVIDIA kernel modules into the running kernel
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - nvidia
    - nvidia_modeset
    - nvidia_uvm
  failed_when: false

- name: Install the CDI regeneration unit
  ansible.builtin.template:
    src: nvidia-cdi-generator.service.j2
    dest: /etc/systemd/system/nvidia-cdi-generator.service
    owner: root
    group: root
    mode: '0644'
  notify: Regenerate NVIDIA CDI specification

- name: Enable and start the CDI generator
  ansible.builtin.systemd_service:
    name: nvidia-cdi-generator.service
    state: started
    enabled: true
    daemon_reload: true

- name: Verify the driver sees the GPU
  ansible.builtin.command:
    cmd: nvidia-smi
  changed_when: false

- name: Read the installed driver version
  ansible.builtin.command:
    cmd: nvidia-smi --query-gpu=driver_version --format=csv,noheader
  register: nvidia_driver_version
  changed_when: false

- name: Assert the driver is new enough for the CUDA 13 images
  ansible.builtin.assert:
    that:
      - nvidia_driver_version.stdout_lines[0] is version(nvidia_min_driver_version, '>=')
    fail_msg: >-
      NVIDIA driver {{ nvidia_driver_version.stdout_lines[0] }} is older than
      {{ nvidia_min_driver_version }}: the CUDA 13.0 container images
      (sglang v0.5.20-cu130, docling-serve-cu130) require it.
