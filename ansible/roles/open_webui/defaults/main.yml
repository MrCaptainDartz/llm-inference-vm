---
open_webui_user: "{{ inference_user | default('inference') }}"

open_webui_image: "ghcr.io/open-webui/open-webui:main"
open_webui_port: 8080

# LiteLLM is the only API exposed by the inference LXC; Open WebUI never
# talks to vLLM directly.
open_webui_connect_litellm: true
open_webui_litellm_base_url: "{{ litellm_base_url | default('http://192.0.2.10:4000/v1') }}"
open_webui_litellm_api_key: "{{ litellm_master_key | default('litellm') }}"
open_webui_connect_litellm_embedding: true
open_webui_embedding_model: "{{ vllm_embedding_served_model_name | default('qwen3-embedding-0.6b') }}"

# Extra environment for the container (see https://docs.openwebui.com/getting-started/env-configuration).
open_webui_env: {}
# Keep signup open for the first admin login; close it from the admin panel afterwards.
open_webui_enable_signup: true

# Airgap: OFFLINE_MODE=true in the container (no outbound calls).
open_webui_offline_mode: "{{ airgap_mode | default(false) }}"

# Airgap: load the image from the bundle instead of pulling from the registry.
open_webui_offline: "{{ airgap_mode | default(false) }}"

# Bundle location on the VM (airgap only).
open_webui_bundle_dir: "{{ llm_bundle_dir | default('/airgap-bundle') }}"
