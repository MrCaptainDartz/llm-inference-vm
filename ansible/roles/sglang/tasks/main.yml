---
# Deploys SGLang as Quadlet-managed rootless containers (chat + embedding).

- name: Assert a target model is configured
  ansible.builtin.assert:
    that:
      - sglang_model_path is defined
      - sglang_model_path | length > 0
    fail_msg: "sglang_model_path is empty: set it in group_vars (README)."

- name: Assert the GPU host role is enabled when GPU access is requested
  ansible.builtin.assert:
    that:
      - not (sglang_gpu | default(false)) or (nvidia_enabled | default(false))
    fail_msg: >-
      sglang_gpu is true but nvidia_enabled is false: enable the nvidia role,
      or set sglang_gpu to false for a CPU-only (non-functional) deployment.

- name: Create the Quadlet directory for the inference user
  ansible.builtin.file:
    path: "/home/{{ sglang_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ sglang_user }}"
    group: "{{ sglang_user }}"
    mode: '0755'

- name: Create the Hugging Face cache directory
  ansible.builtin.file:
    path: "/home/{{ sglang_user }}/models/hf"
    state: directory
    owner: "{{ sglang_user }}"
    group: "{{ sglang_user }}"
    mode: '0755'

- name: Deploy the SGLang Quadlet
  ansible.builtin.template:
    src: sglang.container.j2
    dest: "/home/{{ sglang_user }}/.config/containers/systemd/sglang.container"
    owner: "{{ sglang_user }}"
    group: "{{ sglang_user }}"
    mode: '0644'


- name: Deploy the SGLang embedding Quadlet
  ansible.builtin.template:
    src: sglang-embedding.container.j2
    dest: "/home/{{ sglang_user }}/.config/containers/systemd/sglang-embedding.container"
    owner: "{{ sglang_user }}"
    group: "{{ sglang_user }}"
    mode: '0644'
  when: sglang_embedding_enabled | default(false)

- name: Allow SGLang API port through the firewall
  community.general.ufw:
    rule: allow
    port: "{{ sglang_port | string }}"
    proto: tcp
    comment: SGLang OpenAI-compatible API

- name: Get inference user UID
  ansible.builtin.command:
    cmd: "id -u {{ sglang_user }}"
  register: sglang_uid_result
  changed_when: false

- name: Create the local models directory (airgap)
  ansible.builtin.file:
    path: "/home/{{ sglang_user }}/models"
    state: directory
    owner: "{{ sglang_user }}"
    group: "{{ sglang_user }}"
    mode: '0755'
  when: sglang_offline | default(false)

- name: Copy the model snapshots from the bundle (airgap)
  ansible.builtin.copy:
    src: "{{ sglang_bundle_dir }}/models/"
    dest: "/home/{{ sglang_user }}/models/"
    remote_src: true
    mode: preserve
    owner: "{{ sglang_user }}"
    group: "{{ sglang_user }}"
  when: sglang_offline | default(false)

- name: Check if the SGLang image is already loaded (airgap)
  ansible.builtin.command:
    cmd: "podman image exists {{ sglang_image }}"
  register: sglang_image_loaded
  failed_when: false
  changed_when: false
  become: true
  become_user: "{{ sglang_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ sglang_uid_result.stdout }}"
  when: sglang_offline | default(false)

- name: Load the SGLang image from the bundle (airgap)
  ansible.builtin.command:
    cmd: "podman load -i {{ sglang_bundle_dir }}/images/sglang.tar"
  become: true
  become_user: "{{ sglang_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ sglang_uid_result.stdout }}"
  changed_when: true
  when:
    - sglang_offline | default(false)
    - sglang_image_loaded.rc != 0

- name: Reload user systemd and restart SGLang
  ansible.builtin.systemd_service:
    name: sglang.service
    scope: user
    state: restarted
    enabled: true
    daemon_reload: true
  become: true
  become_user: "{{ sglang_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ sglang_uid_result.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ sglang_uid_result.stdout }}/bus"

- name: Reload user systemd and restart SGLang embedding
  ansible.builtin.systemd_service:
    name: sglang-embedding.service
    scope: user
    state: restarted
    enabled: true
    daemon_reload: true
  become: true
  become_user: "{{ sglang_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ sglang_uid_result.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ sglang_uid_result.stdout }}/bus"
  when: sglang_embedding_enabled | default(false)
